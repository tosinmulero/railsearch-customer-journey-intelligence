[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railsearch-customer-journey-intelligence"
version = "0.1.0"
description = "Product analytics and data science platform for rail customer journey and conversion intelligence."
requires-python = ">=3.10"
authors = [
    {name = "Oluwatosin Oluwaseun Mulero"}
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"